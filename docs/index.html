<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毒蘑菇 · 在线试玩</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a20;color:#eee8cf;font-family:system-ui,"Microsoft YaHei",sans-serif}header{max-width:1000px;margin:auto;padding:22px 24px 12px;display:flex;gap:18px;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}nav{display:flex;gap:14px;flex-wrap:wrap}a{color:#c6dcd3;text-underline-offset:4px;font-size:14px}main{display:flex;justify-content:center}.stage{position:relative;margin:0 auto;background:#081e24;overflow:hidden;border:1px solid #91804c;border-radius:8px;box-shadow:0 20px 70px #0006}iframe{border:0;position:absolute;top:0;left:0;width:450px;height:975px;transform-origin:top left}.poster{width:100%;height:100%;object-fit:fill}#launch{position:absolute;inset:0;display:grid;place-content:center;background:linear-gradient(#031b2022,#031b20aa);text-align:center}button{cursor:pointer;background:#ded0a3;color:#14343b;border:0;border-radius:6px;font:600 16px system-ui;padding:14px 24px}#launch p{background:#05202ae0;border-radius:7px;padding:10px;font-size:14px}.controls{display:flex;justify-content:center;gap:8px;padding:12px 10px}.controls button{padding:9px 17px;font-size:14px;background:#1d3c42;color:#e4dcb6;border:1px solid #746b48}footer{text-align:center;color:#a9bab8;font-size:12px;padding:0 12px 20px;line-height:1.8}@media(max-width:600px){header{padding:14px 15px;align-items:flex-start}h1{font-size:19px}nav{gap:10px}a{font-size:12px}}
</style></head><body><header><h1>毒蘑菇 · 向森林深处奔跑</h1><nav><a href="resources.html">浏览游戏素材</a><a href="https://github.com/Zhiyuan-Xiong/poisonous-mushrooms">项目与源码</a><a href="https://xiongzhiyuan-portfolio.pages.dev/">作品集</a></nav></header><main><div class="stage" id="stage"><img class="poster" src="cover.png" alt="毒蘑菇竖屏游戏预览"><div id="launch"><button id="play-start">加载游戏，立即试玩</button><p>首次加载约 77 MB，请稍候。<br>加载后点击「游戏开始」或按回车。</p></div></div></main><div class="controls"><button data-code="ArrowLeft" data-key="ArrowLeft" data-num="37">← 左移</button><button data-code="Space" data-key=" " data-num="32">跳跃</button><button data-code="ArrowRight" data-key="ArrowRight" data-num="39">右移 →</button><button data-code="Escape" data-key="Escape" data-num="27">暂停</button></div><footer>A / D 或左右方向键切换道路 · 空格跳跃 · Esc / P 暂停 · R / 回车重跑<br>Godot 原版游戏的浏览器导出；使用键盘或下方按钮。</footer><script>
const stage=document.getElementById('stage');let frame=null;function fit(){const s=Math.max(.2,Math.min(1,(innerWidth-28)/450,(innerHeight-158)/975));stage.style.width=(450*s)+'px';stage.style.height=(975*s)+'px';if(frame)frame.style.transform='scale('+s+')'}addEventListener('resize',fit);fit();document.getElementById('play-start').onclick=function(){this.disabled=true;this.textContent='正在准备游戏…';frame=document.createElement('iframe');frame.id='game-frame';frame.title='毒蘑菇游戏';frame.allow='autoplay; fullscreen';frame.src='game.html';stage.appendChild(frame);fit();frame.onload=function(){document.getElementById('launch').remove();frame.contentWindow.focus();const c=frame.contentDocument.getElementById('canvas');if(c)c.focus()}};document.querySelectorAll('[data-code]').forEach(function(b){b.addEventListener('pointerdown',function(e){e.preventDefault();if(!frame)return;const c=frame.contentDocument.getElementById('canvas');if(!c)return;c.focus();const o={bubbles:true,cancelable:true,code:b.dataset.code,key:b.dataset.key,keyCode:Number(b.dataset.num),which:Number(b.dataset.num)};c.dispatchEvent(new KeyboardEvent('keydown',o));setTimeout(function(){c.dispatchEvent(new KeyboardEvent('keyup',o))},90)})});
